name: SearXNG Runner Host

on:
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: searxng-host
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install & Start SearXNG
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-setuptools python3-wheel git
          pip install granian searxng || true
          # Test running searxng engine in background for 10 minutes test window
          python3 -c "import searx; print('SearXNG module imported successfully')"
